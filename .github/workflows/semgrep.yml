name: Semgrep

on:
  push:
    branches: [main]
  schedule:
    - cron: "19 4 * * 4"

permissions: read-all

jobs:
  analysis:
    name: Semgrep Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check out pinned Semgrep rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: semgrep/semgrep-rules
          ref: 311ca4e9ba59d700624539bf658e3d29b134ee77
          path: .semgrep-rules
          persist-credentials: false

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-input "semgrep==1.170.0"

      - name: Run Semgrep
        # This upstream rule flags every non-string assert. PHP 8.1+ does not
        # evaluate assertion strings as code, and this SDK uses boolean invariants.
        run: >-
          semgrep scan
          --config .semgrep-rules/php
          --exclude-rule semgrep-rules.php.lang.security.assert-use
          --error
          --metrics=off
          --sarif
          --output semgrep.sarif
          --exclude vendor
          --exclude .phpunit.cache
          --exclude .semgrep-rules
          .

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: semgrep.sarif
